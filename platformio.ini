; PlatformIO project configuration for the Raceband RSSI scanner.
;
; Default target is an Arduino Nano (ATmega328P). If your Nano uses the
; old bootloader and upload fails, switch board to `nanoatmega328` or add
; `upload_speed = 57600`. An Uno environment is also provided.

[platformio]
default_envs = nanoatmega328new

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -D SERIAL_BAUD=115200

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
monitor_speed = ${env.monitor_speed}

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
upload_speed = 57600
monitor_speed = ${env.monitor_speed}

[env:uno]
platform = atmelavr
board = uno
monitor_speed = ${env.monitor_speed}

[env:nanoatmega328new_tvout]
; Same Nano as nanoatmega328new, but with composite/analog video output via
; the TVout library (see README's "TV Output" section for wiring) - mirrors
; the Web UI's busy/free grid onto a CRT, small composite monitor, or FPV
; goggles instead of/alongside the LEDs.
;
; TVout hard-codes its sync/video pins to D9/D7 on ATmega328 boards, which
; are this project's R8/R6 busy/free LEDs by default, so those two channels'
; LEDs are moved to A1/A2 here (used as plain digital outputs) to free up
; D9/D7 for TVout. R6/R8 need to be rewired to A1/A2 to build this
; environment. The same pattern (add ENABLE_TV_OUT + the TVout lib +
; remapped LED pins) applies to the uno/nanoatmega328 environments too.
platform = atmelavr
board = nanoatmega328new
monitor_speed = ${env.monitor_speed}
lib_deps =
    avamander/TVout@^1.0.2
build_flags =
    ${env.build_flags}
    -D ENABLE_TV_OUT
    -D CHANNEL_STATE_LED_PINS_LIST=2,3,4,5,6,A1,8,A2

[env:promicro16]
; Arduino/SparkFun Pro Micro (ATmega32U4, 5V/16MHz). D11/D12 aren't broken
; out on this board's header, so the RX5808 bus is remapped to D14-D16
; (the SPI-header pins, unused here since the bus is bit-banged).
platform = atmelavr
board = sparkfun_promicro16
monitor_speed = ${env.monitor_speed}
build_flags =
    ${env.build_flags}
    -D RX5808_PIN_DATA=14
    -D RX5808_PIN_CLOCK=15
    -D RX5808_PIN_LE=16

[env:esp32]
; Espressif ESP32 dev board (e.g. "ESP32-DevKitC"/"ESP32 Dev Module"). Its
; WiFi is used to serve the live channel-status web page (see README).
; Pins are remapped off the AVR defaults because GPIO6-11 are wired to the
; module's internal flash chip and unusable as GPIOs, and GPIO0/2/5/12/15
; are boot-mode strapping pins best left alone. RSSI is the only signal
; here read with analogRead(), and WiFi takes over ADC2 for the duration
; it's active, so RSSI specifically needs an ADC1 pin - hence GPIO34. The
; LED pins are plain digitalWrite() outputs, so a couple of them (25/26/27)
; happening to double as ADC2 channels doesn't matter.
platform = espressif32
board = esp32dev
monitor_speed = ${env.monitor_speed}
build_flags =
    ${env.build_flags}
    -D RX5808_PIN_DATA=16
    -D RX5808_PIN_CLOCK=17
    -D RX5808_PIN_LE=18
    -D RX5808_PIN_RSSI=34
    -D CHANNEL_STATE_LED_PINS_LIST=19,21,22,23,25,26,27,32

[env:esp8266]
; Espressif ESP8266 dev board (e.g. NodeMCU/Wemos D1 mini). Like the esp32
; env, its WiFi serves the live channel-status web page (see README), but
; unlike the ESP32 this build has no per-channel busy/free LEDs: the
; ESP8266 doesn't have eight spare GPIOs once WiFi and the RX5808 bus are
; accounted for (several of the pins it does have are boot-mode strapping
; pins best left alone), so CHANNEL_STATE_LEDS_ENABLED is left at its
; ESP8266 default of off (see src/main.cpp) and the Web UI is this board's
; only busy/free indicator. Only the RX5808 bus needs remapping - GPIO4/5/14
; (D2/D1/D5 on a NodeMCU) for DATA/CLOCK/LE, clear of the GPIO0/2/15
; strapping pins - RSSI stays on the A0 default.
platform = espressif8266
board = nodemcuv2
monitor_speed = ${env.monitor_speed}
build_flags =
    ${env.build_flags}
    -D RX5808_PIN_DATA=4
    -D RX5808_PIN_CLOCK=5
    -D RX5808_PIN_LE=14

[env:esp32_tvout]
; Same ESP32 as the esp32 env (Web UI included), with color composite video
; output added via the ESP_8_BIT library - see README's "TV Output" section.
; ESP_8_BIT drives its signal out of the ESP32's DAC on GPIO25, which is R5's
; busy/free LED by default, so that LED moves to GPIO33 to free the pin up.
platform = espressif32
board = esp32dev
monitor_speed = ${env.monitor_speed}
lib_deps =
    roger-random/ESP_8_BIT Color Composite Video Library@^1.3.2
build_flags =
    ${env.build_flags}
    -D ENABLE_TV_OUT
    -D RX5808_PIN_DATA=16
    -D RX5808_PIN_CLOCK=17
    -D RX5808_PIN_LE=18
    -D RX5808_PIN_RSSI=34
    -D CHANNEL_STATE_LED_PINS_LIST=19,21,22,23,33,26,27,32
